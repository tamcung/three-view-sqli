# SQL templates for SQLi dataset construction.
#
# Each template has:
#   id, category, sql, slots
# Each slot has:
#   context — where in SQL the slot sits (governs how an attacker would inject)
#   payload_type — what kind of benign payload should fill it (string / number / identifier)
#
# slot.context values:
#   string_quoted_single   — inside single-quoted string '...'
#   string_quoted_double   — inside double-quoted string "..."
#   numeric_unquoted       — bare number, e.g. WHERE id = {p}
#   like_pattern           — inside LIKE '%{p}%'
#   in_list                — inside IN (...)
#   order_by               — ORDER BY {p}
#   identifier_unquoted    — bare identifier, e.g. SELECT {p} FROM tab
#   date_quoted            — inside quoted date string
templates:

  # ========== AUTH (15) ==========
  - id: auth_001
    category: auth
    sql: "SELECT * FROM users WHERE username = '{p1}' AND password = '{p2}'"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
      p2: {context: string_quoted_single, payload_type: string}
  - id: auth_002
    category: auth
    sql: "SELECT * FROM users WHERE email = '{p1}' AND password = '{p2}'"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
      p2: {context: string_quoted_single, payload_type: string}
  - id: auth_003
    category: auth
    sql: "SELECT * FROM users WHERE name = '{p1}' AND role = '{p2}'"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
      p2: {context: string_quoted_single, payload_type: string}
  - id: auth_004
    category: auth
    sql: "UPDATE users SET password = '{p1}' WHERE token = '{p2}'"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
      p2: {context: string_quoted_single, payload_type: string}
  - id: auth_005
    category: auth
    sql: "SELECT * FROM sessions WHERE token = '{p1}'"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
  - id: auth_006
    category: auth
    sql: "SELECT * FROM sessions WHERE user_id = {p1} AND token = '{p2}'"
    slots:
      p1: {context: numeric_unquoted, payload_type: number}
      p2: {context: string_quoted_single, payload_type: string}
  - id: auth_007
    category: auth
    sql: "SELECT * FROM accounts WHERE id = {p1}"
    slots:
      p1: {context: numeric_unquoted, payload_type: number}
  - id: auth_008
    category: auth
    sql: "SELECT * FROM accounts WHERE email = '{p1}'"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
  - id: auth_009
    category: auth
    sql: "SELECT role FROM users WHERE id = {p1}"
    slots:
      p1: {context: numeric_unquoted, payload_type: number}
  - id: auth_010
    category: auth
    sql: "INSERT INTO login_attempts (username, ip) VALUES ('{p1}', '{p2}')"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
      p2: {context: string_quoted_single, payload_type: string}
  - id: auth_011
    category: auth
    sql: "INSERT INTO users (username, email, password) VALUES ('{p1}', '{p2}', '{p3}')"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
      p2: {context: string_quoted_single, payload_type: string}
      p3: {context: string_quoted_single, payload_type: string}
  - id: auth_012
    category: auth
    sql: "UPDATE users SET password = '{p1}' WHERE id = {p2}"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
      p2: {context: numeric_unquoted, payload_type: number}
  - id: auth_013
    category: auth
    sql: "UPDATE users SET active = 0 WHERE id = {p1}"
    slots:
      p1: {context: numeric_unquoted, payload_type: number}
  - id: auth_014
    category: auth
    sql: "DELETE FROM sessions WHERE token = '{p1}'"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
  - id: auth_015
    category: auth
    sql: "DELETE FROM users WHERE id = {p1}"
    slots:
      p1: {context: numeric_unquoted, payload_type: number}

  # ========== SEARCH (15) ==========
  - id: search_001
    category: search
    sql: "SELECT * FROM products WHERE name LIKE '%{p1}%'"
    slots:
      p1: {context: like_pattern, payload_type: string}
  - id: search_002
    category: search
    sql: "SELECT * FROM products WHERE category = '{p1}'"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
  - id: search_003
    category: search
    sql: "SELECT * FROM products WHERE price BETWEEN {p1} AND {p2}"
    slots:
      p1: {context: numeric_unquoted, payload_type: number}
      p2: {context: numeric_unquoted, payload_type: number}
  - id: search_004
    category: search
    sql: "SELECT id, name FROM users WHERE name LIKE '%{p1}%' LIMIT 50"
    slots:
      p1: {context: like_pattern, payload_type: string}
  - id: search_005
    category: search
    sql: "SELECT * FROM orders WHERE customer_email = '{p1}' ORDER BY created_at DESC"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
  - id: search_006
    category: search
    sql: "SELECT * FROM messages WHERE subject LIKE '%{p1}%' OR body LIKE '%{p1}%'"
    slots:
      p1: {context: like_pattern, payload_type: string}
  - id: search_007
    category: search
    sql: "SELECT title, summary FROM articles WHERE category = '{p1}' AND published = 1"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
  - id: search_008
    category: search
    sql: "SELECT * FROM posts WHERE tags LIKE '%{p1}%'"
    slots:
      p1: {context: like_pattern, payload_type: string}
  - id: search_009
    category: search
    sql: "SELECT * FROM customers WHERE phone = '{p1}'"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
  - id: search_010
    category: search
    sql: "SELECT * FROM comments WHERE post_id = {p1} ORDER BY id DESC"
    slots:
      p1: {context: numeric_unquoted, payload_type: number}
  - id: search_011
    category: search
    sql: "SELECT * FROM events WHERE date >= '{p1}' AND date <= '{p2}'"
    slots:
      p1: {context: date_quoted, payload_type: string}
      p2: {context: date_quoted, payload_type: string}
  - id: search_012
    category: search
    sql: "SELECT * FROM logs WHERE level = '{p1}' AND created_at > '{p2}'"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
      p2: {context: date_quoted, payload_type: string}
  - id: search_013
    category: search
    sql: "SELECT * FROM files WHERE owner = '{p1}' AND mime_type = '{p2}'"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
      p2: {context: string_quoted_single, payload_type: string}
  - id: search_014
    category: search
    sql: "SELECT * FROM addresses WHERE country = '{p1}' AND zip = '{p2}'"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
      p2: {context: string_quoted_single, payload_type: string}
  - id: search_015
    category: search
    sql: "SELECT * FROM tickets WHERE assignee = '{p1}' AND status = '{p2}'"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
      p2: {context: string_quoted_single, payload_type: string}

  # ========== CRUD SELECT (5) ==========
  - id: select_001
    category: crud_select
    sql: "SELECT * FROM items WHERE id = {p1}"
    slots:
      p1: {context: numeric_unquoted, payload_type: number}
  - id: select_002
    category: crud_select
    sql: "SELECT * FROM customers WHERE name = '{p1}'"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
  - id: select_003
    category: crud_select
    sql: "SELECT COUNT(*) FROM tasks WHERE status = '{p1}'"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
  - id: select_004
    category: crud_select
    sql: "SELECT * FROM accounts WHERE active = 1 AND username = '{p1}'"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
  - id: select_005
    category: crud_select
    sql: "SELECT * FROM products WHERE category = '{p1}' LIMIT 10"
    slots:
      p1: {context: string_quoted_single, payload_type: string}

  # ========== CRUD INSERT (5) ==========
  - id: insert_001
    category: crud_insert
    sql: "INSERT INTO logs (msg) VALUES ('{p1}')"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
  - id: insert_002
    category: crud_insert
    sql: "INSERT INTO comments (text, author_id) VALUES ('{p1}', {p2})"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
      p2: {context: numeric_unquoted, payload_type: number}
  - id: insert_003
    category: crud_insert
    sql: "INSERT INTO events (name, date, location) VALUES ('{p1}', '{p2}', '{p3}')"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
      p2: {context: date_quoted, payload_type: string}
      p3: {context: string_quoted_single, payload_type: string}
  - id: insert_004
    category: crud_insert
    sql: "INSERT INTO audit_log (action, user_id, details) VALUES ('{p1}', {p2}, '{p3}')"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
      p2: {context: numeric_unquoted, payload_type: number}
      p3: {context: string_quoted_single, payload_type: string}
  - id: insert_005
    category: crud_insert
    sql: "INSERT INTO metrics (key_name, value) VALUES ('{p1}', {p2})"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
      p2: {context: numeric_unquoted, payload_type: number}

  # ========== CRUD UPDATE (5) ==========
  - id: update_001
    category: crud_update
    sql: "UPDATE orders SET status = '{p1}' WHERE id = {p2}"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
      p2: {context: numeric_unquoted, payload_type: number}
  - id: update_002
    category: crud_update
    sql: "UPDATE users SET bio = '{p1}' WHERE id = {p2}"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
      p2: {context: numeric_unquoted, payload_type: number}
  - id: update_003
    category: crud_update
    sql: "UPDATE inventory SET quantity = {p1} WHERE product_id = {p2}"
    slots:
      p1: {context: numeric_unquoted, payload_type: number}
      p2: {context: numeric_unquoted, payload_type: number}
  - id: update_004
    category: crud_update
    sql: "UPDATE products SET price = {p1} WHERE category = '{p2}'"
    slots:
      p1: {context: numeric_unquoted, payload_type: number}
      p2: {context: string_quoted_single, payload_type: string}
  - id: update_005
    category: crud_update
    sql: "UPDATE settings SET value = '{p1}' WHERE key_name = '{p2}'"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
      p2: {context: string_quoted_single, payload_type: string}

  # ========== CRUD DELETE (5) ==========
  - id: delete_001
    category: crud_delete
    sql: "DELETE FROM items WHERE id = {p1}"
    slots:
      p1: {context: numeric_unquoted, payload_type: number}
  - id: delete_002
    category: crud_delete
    sql: "DELETE FROM logs WHERE created_at < '{p1}'"
    slots:
      p1: {context: date_quoted, payload_type: string}
  - id: delete_003
    category: crud_delete
    sql: "DELETE FROM user_data WHERE user_id = {p1}"
    slots:
      p1: {context: numeric_unquoted, payload_type: number}
  - id: delete_004
    category: crud_delete
    sql: "DELETE FROM sessions WHERE expires_at < '{p1}'"
    slots:
      p1: {context: date_quoted, payload_type: string}
  - id: delete_005
    category: crud_delete
    sql: "DELETE FROM tasks WHERE status = '{p1}' AND created_at < '{p2}'"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
      p2: {context: date_quoted, payload_type: string}

  # ========== JOIN (10) ==========
  - id: join_001
    category: join
    sql: "SELECT u.name, o.id FROM users u JOIN orders o ON u.id = o.user_id WHERE u.email = '{p1}'"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
  - id: join_002
    category: join
    sql: "SELECT p.name, c.name FROM products p JOIN categories c ON p.category_id = c.id WHERE c.name = '{p1}'"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
  - id: join_003
    category: join
    sql: "SELECT c.text, u.name FROM comments c JOIN users u ON c.user_id = u.id WHERE c.post_id = {p1}"
    slots:
      p1: {context: numeric_unquoted, payload_type: number}
  - id: join_004
    category: join
    sql: "SELECT u.name, l.ip FROM users u JOIN login_log l ON u.id = l.user_id WHERE l.ip = '{p1}'"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
  - id: join_005
    category: join
    sql: "SELECT o.id, i.name FROM orders o JOIN order_items oi ON o.id = oi.order_id JOIN items i ON oi.item_id = i.id WHERE o.customer_id = {p1}"
    slots:
      p1: {context: numeric_unquoted, payload_type: number}
  - id: join_006
    category: join
    sql: "SELECT e.name, d.name FROM employees e JOIN departments d ON e.dept_id = d.id WHERE d.name = '{p1}'"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
  - id: join_007
    category: join
    sql: "SELECT m.text FROM messages m JOIN threads t ON m.thread_id = t.id WHERE t.subject = '{p1}'"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
  - id: join_008
    category: join
    sql: "SELECT a.title, u.name FROM articles a JOIN users u ON a.author_id = u.id WHERE u.role = '{p1}'"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
  - id: join_009
    category: join
    sql: "SELECT p.name FROM users u JOIN user_permissions up ON u.id = up.user_id JOIN permissions p ON up.permission_id = p.id WHERE u.email = '{p1}'"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
  - id: join_010
    category: join
    sql: "SELECT p.name, AVG(r.rating) FROM products p JOIN reviews r ON p.id = r.product_id WHERE p.id = {p1} GROUP BY p.name"
    slots:
      p1: {context: numeric_unquoted, payload_type: number}

  # ========== SUBQUERY (10) ==========
  - id: subq_001
    category: subquery
    sql: "SELECT * FROM users WHERE id IN (SELECT user_id FROM orders WHERE total > {p1})"
    slots:
      p1: {context: numeric_unquoted, payload_type: number}
  - id: subq_002
    category: subquery
    sql: "SELECT * FROM products WHERE category_id IN (SELECT id FROM categories WHERE name LIKE '{p1}%')"
    slots:
      p1: {context: like_pattern, payload_type: string}
  - id: subq_003
    category: subquery
    sql: "SELECT * FROM users WHERE EXISTS (SELECT 1 FROM orders WHERE customer_id = users.id AND status = '{p1}')"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
  - id: subq_004
    category: subquery
    sql: "SELECT * FROM accounts WHERE id IN (SELECT account_id FROM logins WHERE created_at > '{p1}')"
    slots:
      p1: {context: date_quoted, payload_type: string}
  - id: subq_005
    category: subquery
    sql: "SELECT * FROM users WHERE id IN (SELECT user_id FROM subscriptions WHERE plan = '{p1}')"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
  - id: subq_006
    category: subquery
    sql: "SELECT * FROM products WHERE id NOT IN (SELECT product_id FROM order_items WHERE order_date > '{p1}')"
    slots:
      p1: {context: date_quoted, payload_type: string}
  - id: subq_007
    category: subquery
    sql: "SELECT * FROM users WHERE role = (SELECT role FROM users WHERE id = {p1})"
    slots:
      p1: {context: numeric_unquoted, payload_type: number}
  - id: subq_008
    category: subquery
    sql: "SELECT * FROM products WHERE price > (SELECT AVG(price) FROM products WHERE category = '{p1}')"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
  - id: subq_009
    category: subquery
    sql: "SELECT * FROM resources WHERE owner_id IN (SELECT user_id FROM permissions WHERE role = '{p1}')"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
  - id: subq_010
    category: subquery
    sql: "SELECT * FROM posts WHERE id IN (SELECT post_id FROM tags WHERE name = '{p1}')"
    slots:
      p1: {context: string_quoted_single, payload_type: string}

  # ========== AGGREGATE (5) ==========
  - id: agg_001
    category: aggregate
    sql: "SELECT COUNT(*), user_id FROM events WHERE event_type = '{p1}' GROUP BY user_id"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
  - id: agg_002
    category: aggregate
    sql: "SELECT category, SUM(total) FROM orders WHERE created_at > '{p1}' GROUP BY category"
    slots:
      p1: {context: date_quoted, payload_type: string}
  - id: agg_003
    category: aggregate
    sql: "SELECT category, COUNT(*) FROM products WHERE active = 1 GROUP BY category HAVING COUNT(*) > {p1}"
    slots:
      p1: {context: numeric_unquoted, payload_type: number}
  - id: agg_004
    category: aggregate
    sql: "SELECT status, AVG(amount) FROM orders WHERE created_at > '{p1}' GROUP BY status"
    slots:
      p1: {context: date_quoted, payload_type: string}
  - id: agg_005
    category: aggregate
    sql: "SELECT user_id, COUNT(*) FROM login_log WHERE ip = '{p1}' GROUP BY user_id HAVING COUNT(*) > {p2}"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
      p2: {context: numeric_unquoted, payload_type: number}

  # ========== ORDER BY (5) ==========
  - id: order_001
    category: orderby
    sql: "SELECT * FROM products WHERE category = '{p1}' ORDER BY {p2}"
    slots:
      p1: {context: string_quoted_single, payload_type: string}
      p2: {context: order_by, payload_type: identifier}
  - id: order_002
    category: orderby
    sql: "SELECT * FROM users WHERE active = 1 ORDER BY {p1}"
    slots:
      p1: {context: order_by, payload_type: identifier}
  - id: order_003
    category: orderby
    sql: "SELECT * FROM logs WHERE level = 'error' ORDER BY {p1} LIMIT {p2}"
    slots:
      p1: {context: order_by, payload_type: identifier}
      p2: {context: numeric_unquoted, payload_type: number}
  - id: order_004
    category: orderby
    sql: "SELECT * FROM orders ORDER BY {p1}"
    slots:
      p1: {context: order_by, payload_type: identifier}
  - id: order_005
    category: orderby
    sql: "SELECT * FROM tasks ORDER BY {p1}"
    slots:
      p1: {context: order_by, payload_type: identifier}
