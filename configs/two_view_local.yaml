# Two-view model: surface + lexical (drop AST view).
# Trained on new random-split dataset, no de-obfuscation.
# Config tuned for local GTX 1070 Ti (Pascal, no BF16) — uses fp32.

model_variant: no_ast

model:
  surface_vocab_size: 50265
  surface_max_len: 257
  surface_pad_id: 1
  lex_vocab_size: 24
  lex_max_len: 129
  ast_vocab_size: 100
  ast_max_len: 257
  d_surface: 384
  d_abstract: 256
  n_layers: 4
  n_heads: 4
  dropout: 0.1

epochs: 5
batch_size: 32                # smaller batch for 8GB VRAM
lr: 2.0e-4
weight_decay: 0.01
warmup_frac: 0.05
view_dropout: 0.1
amp: fp16                     # Pascal supports fp16 with GradScaler

num_workers: 2
log_every_steps: 50
