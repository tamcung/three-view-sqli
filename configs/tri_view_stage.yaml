# Tri-view, Stage1+Stage2 architecture (CharCNN-pool replaces AST view).
# Mirrors original ThreeViewModel: stage1 self-attn over [z_lex, z_char_pool],
# stage2 cross-attn (Q = stage1 abstract, K,V = H_BPE).

model_variant: bpe_char_lex_stage

model:
  # BPE surface
  surface_vocab_size: 50265
  surface_max_len: 257
  surface_pad_id: 1
  d_surface: 384
  # CharCNN (used via global pool)
  char_vocab_size: 257
  char_embed_dim: 64
  char_kernel_sizes: [3, 5, 7]
  char_num_filters: 128
  # Lex
  lex_vocab_size: 24
  lex_max_len: 129
  # Fusion
  d_fusion: 256
  n_heads: 4
  n_layers: 4
  hidden_dim: 64
  dropout: 0.1

epochs: 5
batch_size: 32
lr: 2.0e-4
weight_decay: 0.01
warmup_frac: 0.05
view_dropout: 0.1
amp: fp16

num_workers: 2
log_every_steps: 50
