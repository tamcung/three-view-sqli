# Ablation: drop surface view (lexical + AST only). Keeps the same fusion
# stack as the full model but feeds an empty surface input.

model_variant: no_surface

model:
  surface_vocab_size: 50265
  surface_max_len: 513
  surface_pad_id: 1
  lex_vocab_size: 24
  lex_max_len: 129
  ast_vocab_size: 100
  ast_max_len: 257
  d_surface: 384
  d_abstract: 256
  n_layers: 4
  n_heads: 4
  dropout: 0.1

epochs: 5
batch_size: 64
lr: 2.0e-4
weight_decay: 0.01
warmup_frac: 0.05
view_dropout: 0.0
amp: bf16

num_workers: 2
log_every_steps: 50
