# Ablation: lexical (libinjection-style 24-vocab) view only.

model_variant: lexical_only

model:
  lex_vocab_size: 24
  lex_max_len: 129
  d_abstract: 256
  n_layers: 4
  n_heads: 4
  dropout: 0.1

epochs: 5
batch_size: 64
lr: 2.0e-4
weight_decay: 0.01
warmup_frac: 0.05
view_dropout: 0.0
amp: bf16

num_workers: 2
log_every_steps: 50
