# Full-scale config: full WAF-A-MoLE training data.
#
# Train: ~590k (293k attacks + 296k benign at 80% of available)
# Val:   ~74k
# Test:  ~74k
#
# Estimated wall time on RTX 4090 with BF16: ~30-50 minutes for 5 epochs.

experiment_name: full_v1

# Data — set to a large number; dataset auto-clips at available size
n_train_per_class: 280000   # 280k attacks + 280k benign = 560k train
n_val_per_class: 35000
n_test_per_class: 35000
seed: 42

model:
  surface_vocab_size: 50265
  surface_max_len: 513
  surface_pad_id: 1
  lex_vocab_size: 24
  lex_max_len: 129
  ast_vocab_size: 100
  ast_max_len: 257
  d_surface: 384
  d_abstract: 256
  n_layers: 4
  n_heads: 4
  dropout: 0.1

train:
  epochs: 5
  batch_size: 64
  lr: 2.0e-4
  weight_decay: 1.0e-4
  view_dropout_prob: 0.1
  grad_clip: 1.0
  warmup_steps: 1000
  loss_weights: [0.7, 0.1, 0.1, 0.1]
  use_bf16: true
  num_workers: 4

log_every: 200
val_every_epoch: true
save_best: true
